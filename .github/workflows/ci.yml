name: CI
on:
  pull_request:
    branches: [develop, main, 'release/**', 'releases/**']
    # edited includes base retargeting; merely leaving draft does not rerun CI.
    types: [opened, synchronize, reopened, edited]
  # Development validation is PR-only and explicitly scoped to the current work.
  # No push/merge/manual full-suite fallback; predeployment needs separate approval.
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  impact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      plan: ${{ steps.select.outputs.plan }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # The planner validates the explicit work manifest; test execution follows
      # only its named selections, including any selected CI-script tests.
      - id: select
        run: node scripts/ci-impact.mjs
  database:
    needs: impact
    if: ${{ needs.impact.result == 'success' && fromJSON(needs.impact.outputs.plan).jobs['database'] }}
    runs-on: ubuntu-latest
    # Disposable schema setup is retained; regression execution is selected only.
    timeout-minutes: 35
    env:
      CI_IMPACT_PLAN: ${{ needs.impact.outputs.plan }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Official, pinned CLI + actual Supabase Auth schema/Postgres. No hosted
      # project, service credentials, synthetic auth schema or SQL-string-only tests.
      - run: npm run db:start
      - run: npm run db:reset
      - run: npm run db:lint
      - run: node scripts/ci-run-selected.mjs sql
      # Repeat only the selected SQL files to prove their rollback/repeatability.
      - run: node scripts/ci-run-selected.mjs sql
      - run: node scripts/ci-run-selected.mjs races
      - run: node scripts/ci-run-selected.mjs upgrades
      - run: npm run db:types
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: database-types
          path: src/types/database.ts
          if-no-files-found: error
          retention-days: 7
      - run: npm run typecheck
      - name: Check committed generated schema types
        run: |
          # Bootstrap fails this gate after uploading the real generated artifact.
          # Import/commit that output; never merge with missing or stale types.
          git ls-files --error-unmatch src/types/database.ts
          git diff --exit-code -- src/types/database.ts
      - run: npm run db:stop -- --no-backup
        if: always()
  quality:
    needs: impact
    if: ${{ needs.impact.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      CI_IMPACT_PLAN: ${{ needs.impact.outputs.plan }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        if: ${{ fromJSON(needs.impact.outputs.plan).mode == 'scoped' }}
      - run: node scripts/ci-run-selected.mjs lint
      # Dependency-graph compilation, not a cumulative regression run.
      - run: npm run typecheck
        if: ${{ fromJSON(needs.impact.outputs.plan).selection.typecheck == true }}
      - run: node scripts/ci-run-selected.mjs unit
      - run: node scripts/ci-run-selected.mjs fixtures
      # The default browser config serves a production build, but no build or
      # browser installation is needed when that explicit selection is empty.
      - run: npm run build
        if: ${{ fromJSON(needs.impact.outputs.plan).selection.browser.quality[0] != null }}
      - run: npx playwright install --with-deps chromium
        if: ${{ fromJSON(needs.impact.outputs.plan).selection.browser.quality[0] != null }}
      - run: node scripts/ci-run-selected.mjs browser quality
        if: ${{ fromJSON(needs.impact.outputs.plan).selection.browser.quality[0] != null }}
      - uses: actions/upload-artifact@v4
        if: ${{ always() && fromJSON(needs.impact.outputs.plan).selection.browser.quality[0] != null }}
        with:
          name: browser-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  auth-browser:
    needs: impact
    if: ${{ needs.impact.result == 'success' && fromJSON(needs.impact.outputs.plan).jobs['auth-browser'] }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      CI_IMPACT_PLAN: ${{ needs.impact.outputs.plan }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # These uncommitted, CI-only overrides enable a loopback mail sink, never
      # real email delivery or Kakao. Public signup stays disabled.
      - run: node scripts/auth-local-ci.mjs configure
      - run: npm run db:start
      - run: npm run db:reset
      - run: node scripts/auth-local-ci.mjs environment
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node scripts/ci-run-selected.mjs browser auth-browser
      - uses: actions/upload-artifact@v4
