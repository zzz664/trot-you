name: CI
on:
  pull_request:
    branches: [develop, main, 'release/**', 'releases/**']
    # edited includes base retargeting; merely leaving draft does not rerun CI.
    types: [opened, synchronize, reopened, edited]
  # No develop push run: PR validation must not be duplicated after every merge.
  push:
    branches: [main, 'release/**', 'releases/**']
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  impact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      plan: ${{ steps.select.outputs.plan }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # Dependency-free selector/aggregate tests run even for documentation PRs.
      - run: node --test scripts/ci-*.test.mjs
      - id: select
        run: node scripts/ci-impact.mjs
  database:
    needs: impact
    if: ${{ needs.impact.result == 'success' && fromJSON(needs.impact.outputs.plan).jobs['database'] }}
    runs-on: ubuntu-latest
    # Verified feature31 database run approached 20min. Preserve every repeat,
    # race and populated upgrade while adding schedule notice migration gates.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Official, pinned CLI + actual Supabase Auth schema/Postgres. No hosted
      # project, service credentials, synthetic auth schema or SQL-string-only tests.
      - run: npm run db:start
      - run: npm run db:reset
      - run: npm run db:lint
      - run: npm run test:integration
      # Test repeatability and rollback: fixtures must not persist between runs.
      - run: npm run test:integration
      # Independent psql sessions prove lock serialization; the script restores
      # the disposable local database after its committed fictional fixtures.
      - run: npm run test:db:concurrency
      - run: npm run test:db:messaging-concurrency
      - run: npm run test:db:community-concurrency
      - run: npm run test:db:schedule-concurrency
      - run: npm run test:db:points-concurrency
      - run: npm run test:db:notification-concurrency
      - run: npm run test:db:analytics-concurrency
      - run: npm run test:db:settlement-concurrency
      - run: npm run test:db:discovery-concurrency
      - run: npm run test:db:onboarding-concurrency
      - run: npm run test:db:checkout-concurrency
      - run: npm run test:db:enrollment-concurrency
      - run: npm run test:db:renewal-concurrency
      - run: npm run test:db:cancellation-concurrency
      - run: npm run test:db:reconciliation-concurrency
      - run: node scripts/test-media-concurrency.mjs
      - run: node scripts/test-chat-concurrency.mjs
      - run: node scripts/test-reply-concurrency.mjs
      - run: node scripts/test-compose-concurrency.mjs
      - run: node scripts/test-dispatch-concurrency.mjs
      - run: node scripts/test-artist-reply-activity-concurrency.mjs
      - run: npm run test:db:webpush-concurrency
      - run: npm run test:db:billing-notice-concurrency
      - run: npm run test:db:admin-artist-concurrency
      - run: npm run test:db:admin-settings-concurrency
      - run: node scripts/test-admin-settings-upgrade.mjs
      - run: npm run test:db:admin-subscriptions-concurrency
      - run: node scripts/test-admin-subscriptions-upgrade.mjs
      - run: node scripts/test-schedule-management-concurrency.mjs
      - run: node scripts/test-schedule-management-upgrade.mjs
      - run: node scripts/test-schedule-notice-concurrency.mjs
      - run: node scripts/test-schedule-notice-upgrade.mjs
      - run: npm run test:db:content-calendar-concurrency
      - run: node scripts/test-content-calendar-upgrade.mjs
      - run: npm run test:db:community-posts-concurrency
      - run: node scripts/test-community-posts-upgrade.mjs
      - run: npm run test:db:community-interactions-concurrency
      - run: node scripts/test-community-interactions-upgrade.mjs
      - run: npm run db:types
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: database-types
          path: src/types/database.ts
          if-no-files-found: error
          retention-days: 7
      - run: npm run typecheck
      - name: Check committed generated schema types
        run: |
          # Bootstrap fails this gate after uploading the real generated artifact.
          # Import/commit that output; never merge with missing or stale types.
          git ls-files --error-unmatch src/types/database.ts
          git diff --exit-code -- src/types/database.ts
      - run: npm run db:stop -- --no-backup
        if: always()
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:all
      - run: npm run test:enrollment-fixture
      - run: npm run test:renewal-fixture
      - run: npm run test:cancellation-fixture
      - run: npm run test:reconciliation-fixture
      - run: node --test scripts/media-local-config.test.mjs
      - run: npm run test:chat-fixture
      - run: npm run test:reply-fixture
      - run: npm run test:speech-fixture
      - run: npm run test:compose-fixture
      - run: npm run test:dispatch-fixture
      - run: npm run test:activity-fixture
      - run: npm run test:webpush-fixture
      - run: npm run test:billing-notices-fixture
      - run: npm run test:admin-artists-fixture
      - run: npm run test:admin-settings-fixture
      - run: npm run test:admin-subscriptions-fixture
      - run: npm run test:schedules-fixture
      - run: npm run test:schedule-notices-fixture
      - run: npm run test:content-calendar-fixture
      - run: npm run test:community-posts-fixture
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  auth-browser:
    needs: impact
    if: ${{ needs.impact.result == 'success' && fromJSON(needs.impact.outputs.plan).jobs['auth-browser'] }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # These uncommitted, CI-only overrides enable a loopback mail sink, never
      # real email delivery or Kakao. Public signup stays disabled.
      - run: node scripts/auth-local-ci.mjs configure
      - run: npm run db:start
      - run: npm run db:reset
      - run: node scripts/auth-local-ci.mjs environment
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config playwright.auth.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: auth-browser-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - run: npm run db:stop -- --no-backup
        if: always()
  enrollment-browser:
    needs: impact
    if: ${{ needs.impact.result == 'success' && fromJSON(needs.impact.outputs.plan).jobs['enrollment-browser'] }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
