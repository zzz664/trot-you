name: CI
on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Official, pinned CLI + actual Supabase Auth schema/Postgres. No hosted
      # project, service credentials, synthetic auth schema or SQL-string-only tests.
      - run: npm run db:start
      - run: npm run db:reset
      - run: npm run db:lint
      - run: npm run test:integration
      # Test repeatability and rollback: fixtures must not persist between runs.
      - run: npm run test:integration
      # Independent psql sessions prove lock serialization; the script restores
      # the disposable local database after its committed fictional fixtures.
      - run: npm run test:db:concurrency
      - run: npm run test:db:messaging-concurrency
      - run: npm run test:db:community-concurrency
      - run: npm run test:db:schedule-concurrency
      - run: npm run test:db:points-concurrency
      - run: npm run test:db:notification-concurrency
      - run: npm run test:db:analytics-concurrency
      - run: npm run test:db:settlement-concurrency
      - run: npm run test:db:discovery-concurrency
      - run: npm run test:db:onboarding-concurrency
      - run: npm run test:db:checkout-concurrency
      - run: npm run test:db:enrollment-concurrency
      - run: npm run test:db:renewal-concurrency
      - run: npm run test:db:cancellation-concurrency
      - run: npm run test:db:reconciliation-concurrency
      - run: node scripts/test-media-concurrency.mjs
      - run: node scripts/test-chat-concurrency.mjs
      - run: node scripts/test-reply-concurrency.mjs
      - run: npm run db:types
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: database-types
          path: src/types/database.ts
          if-no-files-found: error
          retention-days: 7
      - run: npm run typecheck
      - name: Check committed generated schema types
        run: |
          # Bootstrap fails this gate after uploading the real generated artifact.
          # Import/commit that output; never merge with missing or stale types.
          git ls-files --error-unmatch src/types/database.ts
          git diff --exit-code -- src/types/database.ts
      - run: npm run db:stop -- --no-backup
        if: always()
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:all
      - run: npm run test:enrollment-fixture
      - run: npm run test:renewal-fixture
      - run: npm run test:cancellation-fixture
      - run: npm run test:reconciliation-fixture
      - run: node --test scripts/media-local-config.test.mjs
      - run: npm run test:chat-fixture
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  auth-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # These uncommitted, CI-only overrides enable a loopback mail sink, never
      # real email delivery or Kakao. Public signup stays disabled.
      - run: node scripts/auth-local-ci.mjs configure
      - run: npm run db:start
      - run: npm run db:reset
      - run: node scripts/auth-local-ci.mjs environment
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config playwright.auth.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: auth-browser-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - run: npm run db:stop -- --no-backup
        if: always()
  enrollment-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node scripts/auth-local-ci.mjs configure
      - run: npm run db:start
      - run: npm run db:reset
      - run: node scripts/auth-local-ci.mjs environment
      - run: node scripts/enrollment-local-ci.mjs environment
      - run: npx playwright install --with-deps chromium
      # No external provider requests. The real adapters use a guarded loopback
      # HTTP fixture; real Auth, private RPCs and ledger run in local Supabase.
      - run: npm run test:e2e:enrollment
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: enrollment-browser-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - run: npm run db:stop -- --no-backup
        if: always()
  renewal-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node scripts/auth-local-ci.mjs configure
      - run: npm run db:start
      - run: npm run db:reset
      - run: node scripts/auth-local-ci.mjs environment
      - run: node scripts/enrollment-local-ci.mjs environment
      - run: node scripts/renewal-local-ci.mjs environment
      - run: npx playwright install --with-deps chromium
      # No scheduler is enabled. Explicit requests exercise the real protected
      # route with a public fixture secret, local DB and loopback provider only.
      - run: npm run test:e2e:renewal
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renewal-browser-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - run: npm run db:stop -- --no-backup
        if: always()
  cancellation-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node scripts/auth-local-ci.mjs configure
      - run: npm run db:start
      - run: npm run db:reset
      - run: node scripts/auth-local-ci.mjs environment
      - run: node scripts/enrollment-local-ci.mjs environment
      - run: node scripts/renewal-local-ci.mjs environment
      - run: node scripts/cancellation-local-ci.mjs environment
      - run: npx playwright install --with-deps chromium
      # Real Auth/RPC/ledger with fictional test-only policy and loopback HTTP.
      # No external provider, real refund, deployed keys or scheduler is enabled.
      - run: npm run test:e2e:cancellation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cancellation-browser-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - run: npm run db:stop -- --no-backup
        if: always()
  reconciliation-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node scripts/auth-local-ci.mjs configure
      - run: npm run db:start
      - run: npm run db:reset
      - run: node scripts/auth-local-ci.mjs environment
      - run: node scripts/enrollment-local-ci.mjs environment
      - run: node scripts/renewal-local-ci.mjs environment
      - run: node scripts/cancellation-local-ci.mjs environment
      - run: node scripts/reconciliation-local-ci.mjs environment
      - run: npx playwright install --with-deps chromium
      # Real Auth/private RPCs/ledger, query-only worker and untrusted hints.
      # Fixed loopback HTTP only; no registered webhook, scheduler or real money.
      - run: npm run test:e2e:reconciliation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reconciliation-browser-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - run: npm run db:stop -- --no-backup
        if: always()
  media-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node scripts/auth-local-ci.mjs configure
      - run: npm run db:start
      - run: npm run db:reset
      - run: node scripts/auth-local-ci.mjs environment
      - run: node scripts/media-local-ci.mjs environment
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # Actual local Storage uploads/signatures and real Auth/RPC authorization.
      # Only generated fictional bytes; no provider fixtures, hosted buckets,
      # production users, deployed credentials or external requests.
      - run: npm run test:e2e:media
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: media-browser-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - run: npm run db:stop -- --no-backup
        if: always()
  chat-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node scripts/auth-local-ci.mjs configure
      - run: npm run db:start
      - run: npm run db:reset
      - run: node scripts/auth-local-ci.mjs environment
      - run: node scripts/chat-local-ci.mjs environment
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # Real Auth, current readiness, subscription history, cursor RPCs and
      # read receipts in a disposable local database; only fictional content.
      - run: npm run test:e2e:chat
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chat-browser-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - run: npm run db:stop -- --no-backup
        if: always()
